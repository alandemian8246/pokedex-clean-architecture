services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
    volumes:
      - pokedex-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/pokedex
      DB_USERNAME: pokedex
      DB_PASSWORD: pokedex
      JWT_SECRET: ${JWT_SECRET:-docker-compose-demo-secret-change-me-0123456789}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pokedex-data:
